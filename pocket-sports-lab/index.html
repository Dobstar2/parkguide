<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#070b18"><title>Pocket Sports Lab</title><style>html,body{margin:0;height:100%;background:#060915;color:#f5f8ff;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:grid;place-items:center}.l{text-align:center;padding:24px}.orb{width:72px;height:72px;border-radius:50%;margin:auto;background:radial-gradient(circle at 35% 30%,#fff,#59f3ff 18%,#6677ff 55%,#151f51);box-shadow:0 0 40px #59f3ff66;animation:b 1.1s ease-in-out infinite}@keyframes b{50%{transform:translateY(-8px) scale(1.04)}}h1{font-size:clamp(28px,7vw,48px);margin:22px 0 8px;letter-spacing:-.04em}p{color:#91a0be;margin:0;line-height:1.55}</style></head><body><main class="l"><div class="orb"></div><h1>Pocket Sports Lab</h1><p>Synthesising the arena…</p></main><script>const files=[0,1,2,3,4,5,6].map(i=>`data/${i}.txt?v=1`);Promise.all(files.map(p=>fetch(p,{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(`${p}: ${r.status}`);return r.text()}))).then(a=>{const bytes=Uint8Array.from(atob(a.join('')),c=>c.charCodeAt(0));if(!('DecompressionStream'in window))throw Error('Browser decompression is unavailable.');return new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text()}).then(html=>{document.open();document.write(html);document.close()}).catch(err=>{console.error(err);document.body.innerHTML='<main class="l"><h1>Unable to initialise the lab</h1><p>Refresh the page. If this continues, update your browser or use the downloadable edition.</p></main>'});</script></body></html>
