<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#eefbf2">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Stinky's List">
  <link rel="manifest" href="manifest.webmanifest?v=7">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <title>Stinky's Checklist</title>
  <link rel="stylesheet" href="v7.css?v=7">
</head>
<body>
  <section id="welcome" class="welcome">
    <div class="welcome-card">
      <div class="mascot">🐶</div>
      <h1>Stinky's Checklist</h1>
      <p>Tap a meal once. It turns green immediately and updates on the other phone.</p>
      <button id="create" class="primary">Create shared checklist</button>
      <button id="recent" class="recent hidden"></button>
    </div>
  </section>

  <main id="app" class="shell hidden">
    <header class="topbar">
      <div class="logo">🐶</div>
      <div class="topcopy"><h1>Stinky's Checklist</h1><small id="roomLabel"></small></div>
      <button id="settings" class="icon-btn" aria-label="Settings">•••</button>
    </header>
    <div class="status"><span id="syncDot" class="dot"></span><span id="syncText">Connecting live sync…</span></div>

    <section class="progress">
      <div class="progress-top">
        <div><p class="eyebrow">Today's progress</p><h2 id="progressTitle">0 of 4 checked</h2><p id="progressText">Tap a meal when it has been eaten.</p></div>
        <div id="ring" class="ring"><span id="percent">0%</span></div>
      </div>
      <div id="steps" class="steps"></div>
    </section>

    <section id="mealGrid" class="meal-grid"></section>
  </main>

  <div id="settingsSheet" class="sheet-bg hidden">
    <section class="sheet">
      <div class="handle"></div>
      <div class="sheet-head"><div><p class="eyebrow">Settings</p><h2>Shared checklist</h2></div><button id="closeSettings" class="close">×</button></div>
      <label for="viewerName">Name on this phone</label>
      <input id="viewerName" class="field" maxlength="30" placeholder="Stinky or Charlie">
      <button id="saveName" class="save">Save name</button>
      <button id="share" class="setting"><i>🔗</i><span><strong>Share with the other phone</strong><small>Send the private checklist link</small></span></button>
      <button id="copyNtfy" class="setting"><i>🔔</i><span><strong>Copy iPhone notification code</strong><small>Paste this into the ntfy app</small></span></button>
      <div id="topic" class="topic hidden"></div>
      <button id="reset" class="setting"><i>↺</i><span><strong>Reset today</strong><small>Untick all four meals</small></span></button>
    </section>
  </div>
  <div id="toast" class="toast"></div>

  <script src="v7.js?v=7"></script>
</body>
</html>
