<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#111827"><title>Pocket Civilization</title><style>html,body{margin:0;height:100%;background:#0c1220;color:#fff;font-family:system-ui;display:grid;place-items:center}.l{text-align:center}.s{width:44px;height:44px;border:4px solid #2b3954;border-top-color:#7ee787;border-radius:50%;margin:auto;animation:r 1s linear infinite}@keyframes r{to{transform:rotate(360deg)}}</style></head><body><div class="l"><div class="s"></div><p>Building your civilization…</p></div><script>Promise.all(['pocket-civilization/data/0.txt','pocket-civilization/data/1.txt','pocket-civilization/data/2.txt','pocket-civilization/data/3.txt','pocket-civilization/data/4.txt','pocket-civilization/data/5.txt','pocket-civilization/data/6.txt'].map(p=>fetch(p,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(r.status);return r.text()}))).then(a=>{const u=Uint8Array.from(atob(a.join('')),c=>c.charCodeAt(0));return new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'))).text()}).then(h=>{document.open();document.write(h);document.close()}).catch(e=>document.body.innerHTML='<main style="max-width:520px;padding:24px;text-align:center"><h1>Game files are still deploying</h1><p>Open the standalone download for now, or refresh this page once GitHub Pages has published the latest commit.</p></main>');</script></body></html>
